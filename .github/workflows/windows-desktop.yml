name: Windows Desktop Build

on:
  push:
    branches: [desktop-windows-foundation]
  pull_request:
    branches: [main]

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build application and local service
        run: npm run build
      - name: Package Windows installer
        run: npm run desktop:dist
